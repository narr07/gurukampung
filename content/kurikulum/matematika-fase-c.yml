  - id: geometri
    nama: Geometri
    capaian: Mengkonstruksi dan mengurai bangun ruang (kubus, balok, dan gabungannya) dan mengenali visualisasi spasial (bagian depan, atas, dan samping); membandingkan karakteristik antar bangun datar dan antar bangun ruang; serta menentukan lokasi pada peta yang menggunakan sistem berpetak.
    materi:
      - id: bangun-ruang
        nama: Bangun ruang
        kelas:
          - 5
          - 6
        tp:
          - id: bangun-ruang-1
            teks: Murid kelas 5 dapat menyusun dan mengurai kubus, balok, dan gabungannya menggunakan jaring-jaring atau kubus satuan.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menyusun dan mengurai kubus, balok, dan gabungannya
              condition: menggunakan jaring-jaring atau kubus satuan
          - id: bangun-ruang-2
            teks: Murid kelas 6 dapat menentukan tampak depan, atas, dan samping bangun ruang dari susunan kubus satuan, sedikitnya 3 dari 4 soal benar.
            kelas: 6
