# Teks capaian disalin apa adanya dari Kepka BSKAP 046/H/KR/2025 (sumber/kurikulum/CAPAIAN PEMBELAJARAN 046.md).
# Materi, pembagian kelas, dan TP adalah contoh susunan Guru Kampung; sekolah boleh mengubahnya. Jangan ubah id yang sudah dipakai.
contoh: false
mapelId: ipas
mapel: IPAS
fase: C
sumber:
  dokumen: Keputusan Kepala BSKAP Nomor 046/H/KR/2025
  bagian: Lampiran, VI Capaian Pembelajaran Ilmu Pengetahuan Alam dan Sosial (IPAS), Fase C
elemen:
  - id: pemahaman-ipas
    nama: Pemahaman IPAS
    capaian: Merefleksikan sistem organ tubuh manusia yang dikaitkan dengan cara menjaga kesehatan tubuhnya; menganalisis hubungan antar komponen biotik dan abiotik, serta pengaruhnya terhadap ekosistem; menjelaskan fenomena gelombang bunyi dan cahaya dalam kehidupan sehari-hari; menghasilkan upaya penghematan energi, serta pemanfaatan sumber energi alternatif dari sumber daya yang ada di sekitarnya sebagai upaya mitigasi perubahan iklim; menjelaskan sistem tata surya, serta kaitannya dengan rotasi dan revolusi bumi; menjelaskan letak dan kondisi geografis negara Indonesia dengan menggunakan peta konvensional/digital; meninjau sejarah perjuangan para pahlawan di lingkungan sekitar tempat tinggalnya; menemukan keragaman budaya nasional dalam konteks kebhinekaan berdasarkan pemahaman terhadap nilai-nilai kearifan lokal yang berlaku di wilayah tempat tinggal; serta menerapkan kegiatan ekonomi masyarakat di lingkungan sekitar.
    materi:
      - id: letak-geografis
        nama: Letak dan kondisi geografis Indonesia
        kelas:
          - 5
        tp:
          - id: letak-geografis-1
            teks: Murid kelas 5 dapat menjelaskan letak geografis Indonesia menggunakan peta konvensional atau digital, dengan batas wilayah dan posisi Indonesia yang benar.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menjelaskan letak geografis Indonesia
              condition: menggunakan peta konvensional atau digital
              degree: dengan batas wilayah dan posisi Indonesia yang benar
          - id: letak-geografis-2
            teks: Murid kelas 5 dapat menganalisis pengaruh letak dan kondisi geografis Indonesia terhadap kehidupan masyarakat, misalnya sebagai negara maritim dan agraris, dari peta, gambar, dan sumber bacaan, sedikitnya dua pengaruh disertai alasan.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menganalisis pengaruh letak dan kondisi geografis Indonesia terhadap kehidupan masyarakat, misalnya sebagai negara maritim dan agraris
              condition: dari peta, gambar, dan sumber bacaan
              degree: sedikitnya dua pengaruh disertai alasan
      - id: kegiatan-ekonomi
        nama: Kegiatan ekonomi masyarakat
        kelas:
          - 5
        tp:
          - id: kegiatan-ekonomi-1
            teks: Murid kelas 5 dapat menjelaskan kegiatan produksi, distribusi, dan konsumsi dari contoh kegiatan ekonomi di lingkungan sekitar, sedikitnya satu contoh yang benar untuk setiap kegiatan.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menjelaskan kegiatan produksi, distribusi, dan konsumsi
              condition: dari contoh kegiatan ekonomi di lingkungan sekitar
              degree: sedikitnya satu contoh yang benar untuk setiap kegiatan
          - id: kegiatan-ekonomi-2
            teks: Murid kelas 5 dapat menerapkan kegiatan ekonomi sederhana dan mengusulkan solusi atas masalah yang muncul dalam kegiatan jual beli hasil karya kelas, sedikitnya satu solusi yang masuk akal.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menerapkan kegiatan ekonomi sederhana dan mengusulkan solusi atas masalah yang muncul
              condition: dalam kegiatan jual beli hasil karya kelas
              degree: sedikitnya satu solusi yang masuk akal
      - id: ekosistem
        nama: Ekosistem
        kelas:
          - 5
        tp:
          - id: ekosistem-1
            teks: Murid kelas 5 dapat menganalisis hubungan komponen biotik dan abiotik dalam ekosistem, termasuk rantai dan jaring-jaring makanan dari pengamatan lingkungan sekitar atau gambar, sedikitnya tiga hubungan yang benar.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menganalisis hubungan komponen biotik dan abiotik dalam ekosistem, termasuk rantai dan jaring-jaring makanan
              condition: dari pengamatan lingkungan sekitar atau gambar
              degree: sedikitnya tiga hubungan yang benar
          - id: ekosistem-2
            teks: Murid kelas 5 dapat mengevaluasi dampak aktivitas manusia terhadap keseimbangan ekosistem dari kasus nyata di sekitarnya, sedikitnya dua dampak dan satu usulan perbaikan.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: mengevaluasi dampak aktivitas manusia terhadap keseimbangan ekosistem
              condition: dari kasus nyata di sekitarnya
              degree: sedikitnya dua dampak dan satu usulan perbaikan
          - id: ekosistem-3
            teks: Murid kelas 5 dapat menjelaskan siklus air dan mengusulkan upaya menjaga ketersediaan air menggunakan diagram atau model sederhana, dengan urutan tahap yang benar dan sedikitnya dua upaya.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menjelaskan siklus air dan mengusulkan upaya menjaga ketersediaan air
              condition: menggunakan diagram atau model sederhana
              degree: dengan urutan tahap yang benar dan sedikitnya dua upaya
      - id: sejarah-daerah
        nama: Sejarah daerah dan perjuangan pahlawan
        kelas:
          - 5
          - 6
        tp:
          - id: sejarah-daerah-1
            teks: Murid kelas 5 dapat menjelaskan sejarah daerahnya melalui peninggalan sejarah dan warisan budaya dari kunjungan, gambar, atau wawancara narasumber, sedikitnya dua peninggalan beserta ceritanya.
            kelas: 5
            abcd:
              audience: Murid kelas 5
              behavior: menjelaskan sejarah daerahnya melalui peninggalan sejarah dan warisan budaya
              condition: dari kunjungan, gambar, atau wawancara narasumber
              degree: sedikitnya dua peninggalan beserta ceritanya
          - id: sejarah-daerah-2
            teks: Murid kelas 6 dapat meninjau sejarah perjuangan pahlawan di daerahnya dan dampaknya bagi perkembangan daerah dari sumber bacaan atau cerita narasumber, sedikitnya satu dampak disertai bukti.
            kelas: 6
            abcd:
              audience: Murid kelas 6
              behavior: meninjau sejarah perjuangan pahlawan di daerahnya dan dampaknya bagi perkembangan daerah
              condition: dari sumber bacaan atau cerita narasumber
              degree: sedikitnya satu dampak disertai bukti
      - id: organ-tubuh
        nama: Sistem organ tubuh dan kesehatan
        kelas:
