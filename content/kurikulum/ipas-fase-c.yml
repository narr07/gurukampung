          - id: organ-tubuh-2
            teks: Murid kelas 6 dapat menjelaskan organ dan fungsi sistem pencernaan serta cara menjaganya, termasuk memilih makanan bergizi menggunakan gambar atau model organ, dengan urutan organ dan fungsi yang benar.
            kelas: 6
            abcd:
