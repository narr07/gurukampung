          - id: organ-tubuh-3
            teks: Murid kelas 6 dapat menjelaskan organ dan fungsi sistem pernapasan serta cara menjaganya menggunakan gambar atau model organ, dengan urutan organ dan fungsi yang benar.
            kelas: 6
            abcd:
