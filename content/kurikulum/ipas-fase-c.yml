          - id: organ-tubuh-4
            teks: Murid kelas 6 dapat merefleksikan kebiasaan sehari-hari dan menyusun cara menjaga kesehatan sistem organ tubuh berdasarkan catatan kebiasaan selama satu minggu, sedikitnya dua kebiasaan yang akan diperbaiki.
