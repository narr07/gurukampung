# Teks capaian disalin apa adanya dari Kepka BSKAP 046/H/KR/2025 (sumber/kurikulum/CAPAIAN PEMBELAJARAN 046.md).
# Materi, pembagian kelas, dan TP adalah contoh susunan Guru Kampung; sekolah boleh mengubahnya. Jangan ubah id yang sudah dipakai.
contoh: false
mapelId: ipas
mapel: IPAS
fase: B
sumber:
  dokumen: Keputusan Kepala BSKAP Nomor 046/H/KR/2025
  bagian: Lampiran, VI Capaian Pembelajaran Ilmu Pengetahuan Alam dan Sosial (IPAS), Fase B
elemen:
  - id: pemahaman-ipas
    nama: Pemahaman IPAS
    capaian: Menjelaskan bentuk dan fungsi pancaindra; menganalisis siklus hidup makhluk hidup dan upaya pelestariannya; menghasilkan solusi untuk masalah yang berkaitan dengan pelestarian sumber daya alam sebagai upaya mitigasi perubahan iklim; menyimpulkan proses perubahan wujud zat; menjelaskan sumber dan bentuk energi, serta proses perubahan bentuk energi dalam kehidupan sehari-hari; membedakan jenis gaya dan pengaruhnya terhadap arah, gerak, dan bentuk benda; menjelaskan peran, tugas, dan tanggung jawab serta interaksi sosial yang terjadi di sekitar tempat tinggal dan sekolah; mengenali letak kabupaten/kota dan provinsi tempat tinggalnya dengan menggunakan peta konvensional/digital; mengklasifikasikan ragam bentang alam dan keterkaitannya dengan profesi masyarakat, ragam budaya serta upaya untuk melestarikannya; menganalisis sejarah masyarakat di lingkungan tempat tinggal; menjelaskan nilai mata uang dan fungsinya, serta cara mengelola keuangan secara bijak.
    materi:
      - id: pancaindra
        nama: Pancaindra
        kelas:
          - 3
        tp:
          - id: pancaindra-1
            teks: Murid kelas 3 dapat menjelaskan hubungan bentuk dan fungsi setiap pancaindra melalui pengamatan dan percobaan sederhana, dengan tepat untuk kelima indra.
            kelas: 3
            abcd:
              audience: Murid kelas 3
              behavior: menjelaskan hubungan bentuk dan fungsi setiap pancaindra
              condition: melalui pengamatan dan percobaan sederhana
              degree: dengan tepat untuk kelima indra
          - id: pancaindra-2
            teks: Murid kelas 3 dapat menyebutkan cara merawat pancaindra dalam kegiatan sehari-hari dari pengalaman sendiri dan gambar, sedikitnya satu cara untuk setiap indra.
            kelas: 3
            abcd:
              audience: Murid kelas 3
              behavior: menyebutkan cara merawat pancaindra dalam kegiatan sehari-hari
              condition: dari pengalaman sendiri dan gambar
              degree: sedikitnya satu cara untuk setiap indra
      - id: siklus-hidup
        nama: Siklus hidup makhluk hidup
        kelas:
          - 3
        tp:
          - id: siklus-hidup-1
            teks: Murid kelas 3 dapat menceritakan kembali tahapan siklus hidup hewan atau tumbuhan di sekitarnya menggunakan gambar atau model sederhana, dengan urutan tahap yang benar.
            kelas: 3
            abcd:
              audience: Murid kelas 3
              behavior: menceritakan kembali tahapan siklus hidup hewan atau tumbuhan di sekitarnya
              condition: menggunakan gambar atau model sederhana
              degree: dengan urutan tahap yang benar
          - id: siklus-hidup-2
            teks: Murid kelas 3 dapat menganalisis perubahan pada setiap tahap siklus hidup dan upaya melestarikan makhluk hidup tersebut dari hasil pengamatan atau gambar, sedikitnya satu upaya pelestarian yang sesuai.
            kelas: 3
            abcd:
              audience: Murid kelas 3
              behavior: menganalisis perubahan pada setiap tahap siklus hidup dan upaya melestarikan makhluk hidup tersebut
              condition: dari hasil pengamatan atau gambar
              degree: sedikitnya satu upaya pelestarian yang sesuai
      - id: wujud-zat
        nama: Wujud zat dan perubahannya
        kelas:
          - 3
        tp:
          - id: wujud-zat-1
            teks: Murid kelas 3 dapat membedakan benda padat, cair, dan gas berdasarkan ciri-cirinya melalui pengamatan benda di sekitarnya, sedikitnya 8 dari 10 benda benar.
            kelas: 3
            abcd:
              audience: Murid kelas 3
              behavior: membedakan benda padat, cair, dan gas berdasarkan ciri-cirinya
              condition: melalui pengamatan benda di sekitarnya
              degree: sedikitnya 8 dari 10 benda benar
          - id: wujud-zat-2
            teks: Murid kelas 3 dapat menyimpulkan proses perubahan wujud zat (mencair, membeku, menguap, mengembun) dari percobaan sederhana, dengan kesimpulan yang sesuai hasil percobaan.
            kelas: 3
            abcd:
              audience: Murid kelas 3
              behavior: menyimpulkan proses perubahan wujud zat (mencair, membeku, menguap, mengembun)
              condition: dari percobaan sederhana
              degree: dengan kesimpulan yang sesuai hasil percobaan
      - id: energi
