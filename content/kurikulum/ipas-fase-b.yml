          - id: pelestarian-alam-2
            teks: Murid kelas 4 dapat menghasilkan solusi untuk melestarikan sumber daya alam sebagai upaya mitigasi perubahan iklim, misalnya hemat air atau mengurangi sampah plastik, berdasarkan masalah nyata di sekitar sekolah atau rumah, sedikitnya satu solusi yang dapat dilakukan sendiri.
            kelas: 4
